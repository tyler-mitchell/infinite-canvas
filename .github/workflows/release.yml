name: Release

# Changesets owns versioning and publication. A push to main that touches `.changeset/`
# opens or updates a version pull request; merging that pull request publishes.
#
# This replaces a hand-managed `version` field in the package manifest, which required
# remembering to bump it, to write a changelog entry, and to tag — three steps that drift
# apart the first time one is skipped.
on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency: release

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # `id-token` is what mints the OIDC token npm provenance is signed with. Without it a
      # provenance publish fails, which is why a local `pnpm publish` cannot produce one.
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          # `release` runs the package's full `verify` first — build, publint, attw, the
          # consumer install, and the source-reading gates — so nothing reaches the registry
          # that has not been installed and driven at least once.
          publish: pnpm release
          version: pnpm release:version
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
