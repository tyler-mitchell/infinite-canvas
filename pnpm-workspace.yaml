packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  react: ^19.2.7
  react-dom: ^19.2.7
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@vitejs/plugin-react": ^6.0.2
  # Framework stack — pinned to versions proven together in kek-monorepo.
  "@legendapp/state": 3.0.0-beta.47
  "@react-three/fiber": 10.0.0-canary.dbbe704
  three: 0.181.2
  "@types/three": 0.184.1
  "@tanstack/hotkeys": ^0.7.1
  arktype: ^2.2.0
  "@zumer/snapdom": ^2.9.0
  lucide-react: ^0.577.0
  # Playground / UI kit stack.
  "@base-ui/react": ^1.4.0
  "@tanstack/react-router": ^1.167.0
  "@tanstack/router-plugin": ^1.167.32
  tailwindcss: ^4.2.2
  "@tailwindcss/vite": ^4.2.2
  tw-animate-css: ^1.4.0
  shadcn: ^4.3.0
  "@fontsource-variable/geist": ^5.2.8
  tailwind-variants: ^3.2.2
  tailwind-merge: ^3.5.0
  clsx: ^2.1.1
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
