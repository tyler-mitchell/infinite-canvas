packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  # Pinned exactly: these were `@latest`, so every `install` silently upgraded
  # the whole toolchain. A 0.1.24 -> 0.2.2 drift broke `vp test`'s vitest bin
  # resolution mid-session. Reproducible builds require exact pins here; bump
  # deliberately, with the full `ready` gate.
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24
  vite-plus: 0.1.24
  react: ^19.2.7
  react-dom: ^19.2.7
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@vitejs/plugin-react": ^6.0.2
  # Framework stack — pinned to versions proven together in kek-monorepo.
  "@legendapp/state": 3.0.0-beta.47
  "@react-three/fiber": 10.0.0-canary.dbbe704
  "@react-three/drei": 10.7.7
  motion: ^12.40.0
  three: 0.181.2
  "@types/three": 0.184.1
  "@tanstack/hotkeys": ^0.7.1
  arktype: ^2.2.0
  "@zumer/snapdom": ^2.9.0
  lucide-react: ^0.577.0
  # Playground / UI kit stack.
  "@base-ui/react": ^1.4.0
  "@tanstack/react-router": ^1.167.0
  "@tanstack/router-plugin": ^1.167.32
  tailwindcss: ^4.2.2
  "@tailwindcss/vite": ^4.2.2
  tw-animate-css: ^1.4.0
  shadcn: ^4.3.0
  "@fontsource-variable/geist": ^5.2.8
  tailwind-variants: ^3.2.2
  tailwind-merge: ^3.5.0
  clsx: ^2.1.1
  publint: ^0.3.23
  "@arethetypeswrong/core": ^0.18.5
  "@arethetypeswrong/cli": ^0.18.5
  execa: ^10.0.1
  "@varlock/bumpy": 1.18.1
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
