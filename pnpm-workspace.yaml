  "@react-three/fiber": 10.0.0-canary.dbbe704
  "@react-three/drei": 10.7.7
  motion: ^12.40.0
  use-resize-observer: ^10.0.0
  three: 0.181.2
  "@types/three": 0.184.1
  "@tanstack/hotkeys": ^0.7.1
  "@tanstack/pacer": 0.22.0
  "@tanstack/react-start": ^1.168.49
  arktype: ^2.2.3
